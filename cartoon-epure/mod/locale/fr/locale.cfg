[mod-setting-name]
cartoon-epure-herbes=Herbes (%)
cartoon-epure-plantes=Plantes et buissons (%)
cartoon-epure-cailloux=Cailloux (%)
cartoon-epure-taches=Taches au sol (%)

[mod-setting-description]
cartoon-epure-herbes=Densité des touffes d'herbe, en % de celle du jeu (0 = aucune).
cartoon-epure-plantes=Densité des petites plantes et buissons, en % de celle du jeu (0 = aucune).
cartoon-epure-cailloux=Densité des petits cailloux (pas les gros rochers), en % de celle du jeu (0 = aucun).
cartoon-epure-taches=Densité des taches de boue et de sable sur le sol, en % de celle du jeu (0 = aucune).

[command-help]
cartoon-epure=Refait les décorations de la surface actuelle avec les densités réglées (modifie la partie).

[cartoon-epure]
done=Décorations refaites sur __1__.
