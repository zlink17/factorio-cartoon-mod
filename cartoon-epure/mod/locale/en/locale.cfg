[mod-setting-name]
cartoon-epure-herbes=Grass (%)
cartoon-epure-plantes=Plants and bushes (%)
cartoon-epure-cailloux=Pebbles (%)
cartoon-epure-taches=Ground stains (%)

[mod-setting-description]
cartoon-epure-herbes=Grass tuft density, in % of vanilla (0 = none).
cartoon-epure-plantes=Small plant and bush density, in % of vanilla (0 = none).
cartoon-epure-cailloux=Small pebble density (not big rocks), in % of vanilla (0 = none).
cartoon-epure-taches=Mud and sand stain density, in % of vanilla (0 = none).

[command-help]
cartoon-epure=Regenerates the decoratives of the current surface with the configured densities (changes the save).

[cartoon-epure]
done=Decoratives regenerated on __1__.
