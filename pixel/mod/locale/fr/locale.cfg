[mod-setting-name]
pixel-decorations-herbes=Herbes (%)
pixel-decorations-plantes=Plantes et buissons (%)
pixel-decorations-cailloux=Cailloux (%)
pixel-decorations-taches=Taches au sol (%)

[mod-setting-description]
pixel-decorations-herbes=Densité des touffes d'herbe, en % de celle du jeu (0 = aucune).
pixel-decorations-plantes=Densité des petites plantes et buissons, en % de celle du jeu (0 = aucune).
pixel-decorations-cailloux=Densité des petits cailloux (pas les gros rochers), en % de celle du jeu (0 = aucun).
pixel-decorations-taches=Densité des taches de boue et de sable sur le sol, en % de celle du jeu (0 = aucune).

[command-help]
pixel-decorations=Refait les décorations de la surface actuelle avec les densités réglées (modifie la partie).

[pixel-decorations]
done=Décorations refaites sur __1__.
