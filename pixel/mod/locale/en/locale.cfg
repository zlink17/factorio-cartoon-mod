[mod-setting-name]
pixel-decorations-herbes=Grass (%)
pixel-decorations-plantes=Plants and bushes (%)
pixel-decorations-cailloux=Pebbles (%)
pixel-decorations-taches=Ground stains (%)

[mod-setting-description]
pixel-decorations-herbes=Grass tuft density, in % of vanilla (0 = none).
pixel-decorations-plantes=Small plant and bush density, in % of vanilla (0 = none).
pixel-decorations-cailloux=Small pebble density (not big rocks), in % of vanilla (0 = none).
pixel-decorations-taches=Mud and sand stain density, in % of vanilla (0 = none).

[command-help]
pixel-decorations=Regenerates the decoratives of the current surface with the configured densities (changes the save).

[pixel-decorations]
done=Decoratives regenerated on __1__.
